  <script>
    const tl = gsap.timeline({ paused: true });

    tl.fromTo(
      "#s2-dash",
      { opacity: 0, y: 90, scale: 0.96 },
      { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out" },
      0,
    )
      // Arco del gauge y contadores, en paralelo.
      .fromTo(
        "#s2-arc",
        { strokeDashoffset: 377 },
        { strokeDashoffset: 377 * (1 - 89 / 100), duration: 1.8, ease: "power2.out" },
        0.5,
      )
      .fromTo(
        "#s2-score",
        { innerText: 0 },
        { innerText: 89, duration: 1.8, snap: { innerText: 1 }, ease: "power2.out" },
        0.5,
      )
      .fromTo(
        "#s2-tscore",
        { innerText: 0 },
        { innerText: 89, duration: 1.8, snap: { innerText: 1 }, ease: "power2.out" },
        0.5,
      )
      .fromTo(
        "#s2-emblem",
        { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 1, ease: "elastic.out(1, 0.5)" },
        1,
      )
      .fromTo(
        "#s2-down",
        { innerText: 0 },
        { innerText: 1.9, duration: 1.6, snap: { innerText: 0.01 }, ease: "power2.out" },
        1.3,
      )
      .fromTo(
        "#s2-up",
        { innerText: 0 },
        { innerText: 1.12, duration: 1.6, snap: { innerText: 0.01 }, ease: "power2.out" },
        1.5,
      )
      // La línea del gráfico se traza con stroke-dashoffset (pathLength=1).
      .fromTo(
        "#s2-chartline",
        { strokeDasharray: 1, strokeDashoffset: 1 },
        { strokeDashoffset: 0, duration: 1.9, ease: "power2.out" },
        1.8,
      )
      .fromTo("#s2-area", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 1.8);

    // Chips de actividad: entrada y conteo escalonados.
    document.querySelectorAll(".s2-chip").forEach(function (chip, i) {
      var at = 2.4 + i * 0.22;
      var val = chip.querySelector(".sc");
      var bar = chip.querySelector(".bar i");
      tl.fromTo(
        chip,
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        at,
      )
        .fromTo(
          val,
          { innerText: 0 },
          {
            innerText: Number(val.dataset.v),
            duration: 0.8,
            snap: { innerText: 1 },
            ease: "power2.out",
          },
          at,
        )
        .fromTo(
          bar,
          { width: "0%" },
          { width: bar.dataset.w + "%", duration: 0.9, ease: "power2.out" },
          at + 0.1,
        );
    });

    tl.to("#s2-dash", { opacity: 0, duration: 0.4, ease: "power2.in" }, 5.6);

    window.__timelines["scene-dashboard"] = tl;
    tl.seek(0);
