<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
    #cap-layer {
      position: absolute;
      left: 70px;
      right: 70px;
      bottom: 640px;
      text-align: center;
      overflow: visible;
    }
    .cap-g {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      visibility: hidden;
      opacity: 0;
      font-family: var(--sans);
      font-weight: 600;
      font-size: 60px;
      line-height: 1.3;
      text-shadow: 0 4px 30px #000c;
    }
    .cap-g .w {
      display: inline-block;
      color: var(--text);
      opacity: 0.26;
      margin: 0 12px;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-captions"
    data-width="1080"
    data-height="1920"
    data-track-kind="captions"
  >
    <div id="cap-layer"></div>
  </div>

  <script>
    // Timings reales de `npx hyperframes transcribe` (bordes acústicos del audio
    // de Kokoro), trasladados a mis palabras en español por posición.
    // Cada entrada: [palabra, inicio, fin] en el reloj global de 15 s.
    const GROUPS = [
      [["¡Descubre", 0.35, 0.67]],
      [["Connection", 0.83, 1.31], ["Lab!", 1.47, 1.63]],
      [["La", 1.95, 2.03], ["forma", 2.03, 2.19]],
      [["honesta", 2.27, 2.67], ["de", 2.67, 2.75]],
      [["medir", 2.75, 3.15], ["tu", 3.15, 3.31], ["internet.", 3.31, 3.71]],

      [["Velocidad", 4.38, 4.86], ["real,", 4.86, 5.26]],
      [["latencia", 5.26, 5.74], ["y", 5.74, 5.9], ["jitter,", 5.9, 6.54]],
      [["con", 6.54, 6.62], ["un", 6.62, 6.78], ["tier", 6.78, 7.02], ["de", 7.02, 7.1]],
      [["D", 7.1, 7.2], ["a", 7.2, 7.3], ["SS,", 7.3, 7.5]],
      [["y", 7.82, 7.98], ["puntuación", 7.98, 8.46]],
      [["por", 8.46, 8.7], ["actividad.", 8.7, 9.1]],

      [["Pruébalo", 10.4, 10.96], ["ahora", 10.96, 11.2]],
      [["y", 11.2, 11.36], ["comparte", 11.36, 11.68]],
      [["tu", 11.84, 12.0], ["resultado", 12.0, 12.4]],
      [["en", 12.4, 12.56], ["un", 12.56, 12.72], ["toque.", 12.72, 13.12]],
    ];

    const layer = document.getElementById("cap-layer");
    const tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (words) {
      const g = document.createElement("div");
      g.className = "cap-g";
      const els = words.map(function (w) {
        const s = document.createElement("span");
        s.className = "w";
        s.textContent = w[0];
        g.appendChild(s);
        return s;
      });
      layer.appendChild(g);

      const open = words[0][1];
      const close = words[words.length - 1][2];

      // Todo con `set`/`fromTo`: determinista ante seeks en cualquier dirección.
      tl.set(g, { opacity: 1, visibility: "visible" }, open);
      words.forEach(function (w, i) {
        tl.to(els[i], { opacity: 1, duration: 0.14, ease: "power2.out" }, w[1]);
      });
      // Kill duro tras la salida para que ningún grupo quede colgado.
      tl.to(g, { opacity: 0, duration: 0.12, ease: "power2.in" }, close);
      tl.set(g, { opacity: 0, visibility: "hidden" }, close + 0.12);
    });

    window.__timelines["scene-captions"] = tl;
    tl.seek(0);
  </script>
</template>
